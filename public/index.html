<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2by4 Dash</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --border: #1e1e1e;
    --accent: #e8ff00;
    --accent-dim: rgba(232,255,0,0.08);
    --accent-mid: rgba(232,255,0,0.3);
    --text: #f0f0f0;
    --text-dim: #555;
    --text-mid: #888;
    --red: #ff4444;
    --mono: 'Space Mono', monospace;
    --sans: 'DM Sans', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 40px 24px;
  }

  .logo {
    font-family: var(--mono);
    font-size: 13px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.08em;
    margin-bottom: 48px;
  }

  .logo span { color: var(--text-dim); font-weight: 400; }

  /* ── Login ── */
  #login-section {
    width: 100%;
    max-width: 300px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .input {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    padding: 11px 14px;
    outline: none;
    width: 100%;
    transition: border-color 0.15s;
  }

  .input:focus { border-color: var(--accent); }
  .input::placeholder { color: var(--text-dim); }

  .login-btn {
    background: var(--accent);
    border: none;
    color: var(--bg);
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    padding: 11px;
    cursor: pointer;
    letter-spacing: 0.06em;
    transition: opacity 0.15s;
    width: 100%;
  }

  .login-btn:hover { opacity: 0.85; }

  .login-error {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--red);
    display: none;
  }

  /* ── Menu ── */
  #menu-section {
    width: 100%;
    max-width: 560px;
    display: none;
    flex-direction: column;
    gap: 24px;
  }

  .menu-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
  }

  .menu-title {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  .menu-signout {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dim);
    background: none;
    border: none;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: color 0.15s;
  }

  .menu-signout:hover { color: var(--text); }

  .menu-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .menu-card {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 24px;
    text-decoration: none;
    display: flex;
    flex-direction: column;
    gap: 8px;
    transition: border-color 0.15s, background 0.15s;
    cursor: pointer;
  }

  .menu-card:hover {
    border-color: var(--accent-mid);
    background: var(--accent-dim);
  }

  .menu-card-label {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--text-dim);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .menu-card-title {
    font-size: 16px;
    font-weight: 500;
    color: var(--text);
  }

  .menu-card-desc {
    font-size: 12px;
    color: var(--text-mid);
    line-height: 1.5;
    margin-top: 2px;
  }

  .menu-card-arrow {
    font-family: var(--mono);
    font-size: 14px;
    color: var(--text-dim);
    margin-top: auto;
    padding-top: 12px;
    transition: color 0.15s;
  }

  .menu-card:hover .menu-card-arrow { color: var(--accent); }
</style>
</head>
<body>

<div class="logo">2×4 <span>DASH</span></div>

<!-- Login -->
<div id="login-section">
  <input class="input" id="password" type="password" placeholder="Password"
    onkeydown="if(event.key==='Enter') doLogin()">
  <div class="login-error" id="login-error">Incorrect password</div>
  <button class="login-btn" onclick="doLogin()">SIGN IN</button>
</div>

<!-- Menu -->
<div id="menu-section">
  <div class="menu-header">
    <span class="menu-title">Tools</span>
    <button class="menu-signout" onclick="signOut()">Sign out</button>
  </div>
  <div class="menu-grid">
    <a class="menu-card" href="/dash">
      <div class="menu-card-label">Reporting</div>
      <div class="menu-card-title">Media Dashboard</div>
      <div class="menu-card-desc">Ad performance by client, date range, campaign, adset, and ad.</div>
      <div class="menu-card-arrow">→</div>
    </a>
    <a class="menu-card" href="/cpp-daily.html">
      <div class="menu-card-label">Overview</div>
      <div class="menu-card-title">CPP Daily</div>
      <div class="menu-card-desc">Yesterday's account-level CPP for all sticker funnel clients vs 7-day average.</div>
      <div class="menu-card-arrow">→</div>
    </a>
    <!-- Add new tools here -->
  </div>
</div>

<script>
var DASH_PASSWORD = sessionStorage.getItem('dash_password') || '';

function doLogin() {
  var pw = document.getElementById('password').value;
  if (!pw) return;
  fetch('/api/auth/verify', { method: 'POST', headers: { 'x-dash-password': pw } })
    .then(function(r) {
      if (!r.ok) { document.getElementById('login-error').style.display = 'block'; return; }
      DASH_PASSWORD = pw;
      sessionStorage.setItem('dash_password', pw);
      showMenu();
    })
    .catch(function() { document.getElementById('login-error').style.display = 'block'; });
}

function showMenu() {
  document.getElementById('login-section').style.display = 'none';
  document.getElementById('menu-section').style.display = 'flex';
}

function signOut() {
  sessionStorage.removeItem('dash_password');
  document.getElementById('menu-section').style.display = 'none';
  document.getElementById('login-section').style.display = 'flex';
  document.getElementById('password').value = '';
}

// Auto-login if session exists
if (DASH_PASSWORD) {
  fetch('/api/auth/verify', { method: 'POST', headers: { 'x-dash-password': DASH_PASSWORD } })
    .then(function(r) {
      if (r.ok) { showMenu(); }
      else { sessionStorage.removeItem('dash_password'); document.getElementById('password').focus(); }
    }).catch(function() { document.getElementById('password').focus(); });
} else {
  // Check if no password required
  fetch('/api/auth/verify', { method: 'POST' })
    .then(function(r) { if (r.ok) showMenu(); })
    .catch(function() {});
  document.getElementById('password').focus();
}
</script>
</body>
</html>
