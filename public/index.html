<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2by4 Launchpad</title>
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'><rect width='64' height='64' rx='14' fill='%23f8fafc'/><rect x='10' y='10' width='44' height='44' rx='10' fill='none' stroke='%23f59e0b' stroke-width='5'/><rect x='22' y='22' width='20' height='20' rx='3' fill='%230f172a'/></svg>" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0f172a;
    --slate: #334155;
    --slate-2: #64748b;
    --amber: #f59e0b;
    --amber-soft: rgba(245, 158, 11, 0.12);
    --gray: #f8fafc;
    --ink: #111827;
    --line: rgba(15, 23, 42, 0.12);
    --line-soft: rgba(15, 23, 42, 0.06);
    --shadow-sm: 0 4px 18px rgba(15, 23, 42, 0.06);
    --shadow-md: 0 14px 40px rgba(15, 23, 42, 0.08);
    --shadow-lg: 0 24px 80px rgba(15, 23, 42, 0.10);
    --good: #15803d;
    --good-soft: rgba(21, 128, 61, 0.10);
    --over: #b91c1c;
    --over-soft: rgba(185, 28, 28, 0.08);
    --radius-md: 20px;
    --radius-sm: 14px;
    --shell: min(1120px, calc(100vw - 40px));
  }

  *, *::before, *::after { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; min-height: 100vh;
    font-family: "Manrope", sans-serif;
    line-height: 1.5;
    color: var(--ink);
    background:
      radial-gradient(circle at top left, rgba(245, 158, 11, 0.08), transparent 34%),
      linear-gradient(180deg, #ffffff 0%, var(--gray) 62%, #eef3fa 100%);
    background-attachment: fixed;
  }
  a { color: inherit; text-decoration: none; }
  button, input { font: inherit; }

  /* ── Brand mark (matches 2by4llc.com favicon) ── */
  .brand-mark {
    width: 26px; height: 26px;
    border: 2px solid var(--amber);
    border-radius: 5px;
    position: relative;
    flex-shrink: 0;
  }
  .brand-mark::after {
    content: ""; position: absolute; inset: 5px;
    background: var(--navy); border-radius: 2px;
  }
  .brand-mark.lg { width: 36px; height: 36px; border-width: 2.5px; border-radius: 7px; }
  .brand-mark.lg::after { inset: 7px; border-radius: 3px; }

  /* ── Header ── */
  .site-header {
    position: sticky; top: 0; z-index: 20;
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
    background: rgba(248, 250, 252, 0.78);
    border-bottom: 1px solid var(--line-soft);
  }
  .header-bar {
    width: var(--shell);
    margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    gap: 20px; min-height: 80px;
  }
  .brand {
    display: inline-flex; align-items: center; gap: 14px;
  }
  .brand-copy { display: grid; gap: 2px; }
  .brand-copy strong {
    font-size: 1rem; letter-spacing: 0.01em;
    color: var(--navy); font-weight: 700;
  }
  .brand-copy span:last-child {
    font-size: 0.78rem;
    color: rgba(15, 23, 42, 0.65);
    letter-spacing: 0.04em;
  }
  .signout-btn {
    background: transparent;
    border: 1px solid var(--line);
    color: var(--navy);
    border-radius: 999px;
    padding: 9px 18px;
    font-weight: 600; font-size: 0.82rem;
    cursor: pointer;
    transition: background 180ms ease, border-color 180ms ease;
  }
  .signout-btn:hover { background: rgba(15,23,42,0.04); border-color: rgba(15,23,42,0.2); }

  /* ── Page shell ── */
  .page { width: var(--shell); margin: 0 auto; padding: 56px 0 96px; }

  /* ── Hero ── */
  .hero {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 32px; margin-bottom: 56px;
    padding-bottom: 28px;
    border-bottom: 1px solid var(--line-soft);
  }
  .hero h1 {
    margin: 0;
    font-family: "Instrument Serif", serif;
    font-weight: 400;
    color: var(--navy);
    letter-spacing: -0.025em;
    line-height: 0.95;
    font-size: clamp(3rem, 7vw, 4.6rem);
  }
  .hero-date {
    text-align: right;
    color: var(--slate);
    font-weight: 500; font-size: 0.95rem;
    letter-spacing: 0.01em;
  }
  .hero-date strong {
    display: block;
    font-family: "Instrument Serif", serif;
    font-weight: 400; font-style: italic;
    color: var(--navy);
    font-size: 1.5rem;
    margin-top: 4px;
  }

  /* ── Section ── */
  section { margin-bottom: 48px; }
  .section-head {
    display: flex; align-items: baseline; justify-content: space-between;
    gap: 16px; margin-bottom: 18px;
  }
  .section-eyebrow {
    font-size: 0.72rem; font-weight: 700;
    letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--slate);
  }
  .section-eyebrow .dim {
    color: var(--slate-2);
    font-weight: 600;
    margin-left: 8px;
    letter-spacing: 0.12em;
  }
  .section-link {
    font-size: 0.78rem; font-weight: 600;
    color: var(--slate);
    letter-spacing: 0.04em;
    transition: color 180ms ease;
  }
  .section-link:hover { color: var(--amber); }

  /* ── Today (Phase 2 placeholders) ── */
  .today-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 16px;
  }
  .today-block {
    background: #fff;
    border: 1px solid var(--line-soft);
    border-radius: var(--radius-md);
    padding: 24px 26px; min-height: 130px;
    box-shadow: var(--shadow-sm);
    display: flex; flex-direction: column; gap: 14px;
  }
  .today-label {
    font-size: 0.72rem; font-weight: 700;
    letter-spacing: 0.16em; text-transform: uppercase;
    color: var(--slate-2);
  }
  .today-content {
    font-family: "Instrument Serif", serif;
    font-weight: 400; font-style: italic;
    color: var(--slate-2);
    font-size: 1.6rem;
  }
  .today-list {
    display: flex; flex-direction: column;
    margin-top: 2px;
  }
  .today-empty {
    font-family: "Instrument Serif", serif;
    font-style: italic;
    color: var(--slate-2);
    font-size: 1.3rem;
    padding-top: 4px;
  }
  .today-loading {
    font-size: 0.78rem;
    color: var(--slate-2);
    letter-spacing: 0.04em;
    padding-top: 4px;
    animation: pulseFade 1.4s ease-in-out infinite;
  }
  @keyframes pulseFade {
    0%, 100% { opacity: 0.45; }
    50%       { opacity: 0.8; }
  }
  .today-error {
    font-size: 0.78rem;
    color: var(--over);
    letter-spacing: 0.02em;
    padding-top: 4px;
  }
  .meeting-row, .task-row {
    display: flex; align-items: baseline;
    gap: 10px;
    padding: 8px 0;
    border-top: 1px solid var(--line-soft);
    font-size: 0.92rem;
  }
  .meeting-row:first-child, .task-row:first-child { border-top: none; padding-top: 0; }
  .meeting-row:last-child, .task-row:last-child { padding-bottom: 0; }
  .meeting-time {
    color: var(--slate);
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    font-size: 0.82rem;
    min-width: 64px;
    flex-shrink: 0;
  }
  .meeting-title {
    color: var(--navy);
    font-weight: 600;
    flex: 1;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  a.meeting-title { color: var(--navy); transition: color 180ms ease; }
  a.meeting-title:hover { color: var(--amber); }
  .meeting-client, .task-client {
    color: var(--slate-2);
    font-size: 0.78rem;
    font-weight: 600;
    letter-spacing: 0.04em;
  }
  .task-check {
    color: var(--slate-2);
    font-family: "Manrope", sans-serif;
    font-size: 1rem;
    line-height: 1;
    flex-shrink: 0;
  }
  .task-text {
    color: var(--navy);
    flex: 1;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .task-urgent {
    display: inline-block;
    margin-right: 6px;
    padding: 1px 7px;
    border-radius: 999px;
    background: var(--over-soft);
    color: var(--over);
    font-size: 0.65rem; font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase;
    vertical-align: middle;
  }
  .due-chip {
    padding: 2px 9px;
    border-radius: 999px;
    font-size: 0.7rem; font-weight: 700;
    letter-spacing: 0.04em;
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }
  .due-chip.over { background: var(--over-soft); color: var(--over); }
  .due-chip.today { background: rgba(245, 158, 11, 0.14); color: #b45309; }
  .due-chip.future { background: rgba(15, 23, 42, 0.06); color: var(--slate-2); }

  /* ── Mini cards (CPP / CPL) ── */
  .mini-cards {
    display: flex; flex-wrap: wrap; gap: 12px;
  }
  .mini-card {
    background: #fff;
    border: 1px solid var(--line-soft);
    border-radius: var(--radius-sm);
    padding: 16px 16px 14px;
    width: 150px;
    display: flex; flex-direction: column; gap: 8px;
    box-shadow: var(--shadow-sm);
    transition: transform 180ms ease, box-shadow 180ms ease;
  }
  .mini-card:hover { transform: translateY(-1px); box-shadow: var(--shadow-md); }
  .mini-card.good { border-color: rgba(21, 128, 61, 0.25); background: linear-gradient(180deg, var(--good-soft), #fff 65%); }
  .mini-card.over { border-color: rgba(185, 28, 28, 0.25); background: linear-gradient(180deg, var(--over-soft), #fff 65%); }

  .mini-name {
    font-size: 0.7rem; font-weight: 700;
    letter-spacing: 0.12em; text-transform: uppercase;
    color: var(--slate);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .mini-value {
    font-family: "Instrument Serif", serif;
    font-weight: 400;
    font-size: 2.1rem; line-height: 1;
    color: var(--navy);
    font-variant-numeric: tabular-nums;
  }
  .mini-value.good { color: var(--good); }
  .mini-value.over { color: var(--over); }
  .mini-value.none { color: var(--slate-2); font-size: 1.4rem; }

  .mini-sub {
    font-size: 0.74rem;
    color: var(--slate-2);
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.02em;
  }
  .mini-sub-loading { opacity: 0.5; animation: pulse 1.4s ease-in-out infinite; }
  .mini-error {
    font-size: 0.74rem; color: var(--over); font-weight: 600;
  }
  .mini-skel {
    background: #fff; border: 1px solid var(--line-soft);
    border-radius: var(--radius-sm);
    width: 150px; height: 110px;
    box-shadow: var(--shadow-sm);
    animation: pulse 1.4s ease-in-out infinite;
  }
  .empty-row {
    font-size: 0.85rem; color: var(--slate-2);
    padding: 12px 4px;
  }

  @keyframes pulse {
    0%, 100% { opacity: 0.55; }
    50%       { opacity: 0.85; }
  }

  /* ── Tools ── */
  .tool-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
  }
  .tool-btn {
    background: #fff;
    border: 1px solid var(--line-soft);
    border-radius: var(--radius-sm);
    padding: 18px 22px;
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px;
    box-shadow: var(--shadow-sm);
    transition: transform 180ms ease, border-color 180ms ease, box-shadow 180ms ease;
  }
  .tool-btn:hover {
    transform: translateY(-1px);
    border-color: var(--amber);
    box-shadow: var(--shadow-md);
  }
  .tool-btn-label {
    font-weight: 700; font-size: 0.95rem; color: var(--navy);
  }
  .tool-btn-arrow {
    font-weight: 700; font-size: 1rem;
    color: var(--slate-2);
    transition: color 180ms ease, transform 180ms ease;
  }
  .tool-btn:hover .tool-btn-arrow { color: var(--amber); transform: translateX(2px); }

  /* ── Clients placeholder ── */
  .clients-placeholder {
    font-family: "Instrument Serif", serif;
    font-style: italic;
    color: var(--slate-2);
    font-size: 1.3rem;
    padding: 8px 0 4px;
  }

  /* ── Login ── */
  .login-wrap {
    min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    padding: 40px 24px;
    gap: 24px;
  }
  .login-brand {
    display: flex; flex-direction: column; align-items: center; gap: 14px;
    margin-bottom: 12px;
  }
  .login-brand h1 {
    margin: 0;
    font-family: "Instrument Serif", serif;
    font-weight: 400;
    font-size: 2.6rem;
    color: var(--navy);
    letter-spacing: -0.02em;
  }
  .login-brand p {
    margin: 0;
    font-size: 0.82rem;
    color: var(--slate-2);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    font-weight: 600;
  }
  #login-section {
    width: 100%; max-width: 320px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .input {
    background: #fff;
    border: 1px solid var(--line);
    color: var(--navy);
    border-radius: 999px;
    font-size: 0.95rem;
    padding: 14px 20px;
    outline: none; width: 100%;
    transition: border-color 180ms ease, box-shadow 180ms ease;
  }
  .input::placeholder { color: var(--slate-2); }
  .input:focus { border-color: var(--amber); box-shadow: 0 0 0 4px var(--amber-soft); }
  .login-btn {
    background: var(--navy);
    border: none; color: #fff;
    border-radius: 999px;
    padding: 14px;
    font-weight: 700; font-size: 0.9rem;
    cursor: pointer;
    letter-spacing: 0.04em;
    box-shadow: 0 14px 32px rgba(15, 23, 42, 0.18);
    transition: background 180ms ease, transform 180ms ease, box-shadow 180ms ease;
  }
  .login-btn:hover { background: #16203a; transform: translateY(-1px); box-shadow: 0 18px 38px rgba(15, 23, 42, 0.24); }
  .login-error {
    font-size: 0.8rem; color: var(--over);
    text-align: center; display: none;
  }

  @media (max-width: 640px) {
    .header-bar { min-height: 68px; }
    .page { padding: 36px 0 64px; }
    .hero { flex-direction: column; align-items: flex-start; gap: 16px; }
    .hero-date { text-align: left; }
    .today-grid { grid-template-columns: 1fr; }
    .mini-card, .mini-skel { width: calc(50% - 6px); }
    .tool-grid { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<!-- ─── LOGIN ─── -->
<div class="login-wrap" id="login-wrap">

<!-- ─── LAUNCHPAD ─── -->

    <!--
      Phase 3: CLIENTS — per-client cards/index. Placeholder for now.

<script>
var DASH_PASSWORD = sessionStorage.getItem('dash_password') || '';

// ─── Auth ────────────────────────────────────────────────────────────────────

function apiFetch(path) {
  return fetch(path, { headers: { 'x-dash-password': DASH_PASSWORD } }).then(function(r) {
    if (r.status === 401) {
      sessionStorage.removeItem('dash_password');
      showLogin();
      throw new Error('Unauthorized');
    }
    return r.json();
  });
}

function doLogin() {
  var pw = document.getElementById('password').value;
  if (!pw) return;
  fetch('/api/auth/verify', { method: 'POST', headers: { 'x-dash-password': pw } })
    .then(function(r) {
      if (!r.ok) { document.getElementById('login-error').style.display = 'block'; return; }
      DASH_PASSWORD = pw;
      sessionStorage.setItem('dash_password', pw);
      showLaunchpad();
    })
    .catch(function() { document.getElementById('login-error').style.display = 'block'; });
}

function signOut() {
  sessionStorage.removeItem('dash_password');
  DASH_PASSWORD = '';
  showLogin();
}

function showLogin() {
  document.getElementById('login-wrap').style.display = 'flex';
  document.getElementById('page').style.display = 'none';
  setTimeout(function() {
    var el = document.getElementById('password');
    if (el) { el.value = ''; el.focus(); }
  }, 0);
}

function showLaunchpad() {
  document.getElementById('login-wrap').style.display = 'none';
  document.getElementById('page').style.display = 'block';
  renderDate();
  loadMeetings();
  loadTasks();
  loadSticker();
  loadSheds();
}

// ─── Helpers ─────────────────────────────────────────────────────────────────

function fmt$(n) {
  if (n == null || isNaN(n)) return '—';
  return '$' + Number(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}

function renderDate() {
  var d = new Date();
  document.getElementById('today-date').textContent =
    d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
}

function shortName(n) {
  if (!n) return '';
  return n.replace(/\s*\([^)]*\)\s*/g, '').trim();
}

function escapeHtml(s) {
  if (s == null) return '';
  return String(s).replace(/[&<>"']/g, function(c) {
    return ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'})[c];
  });
}

function fmtTime(iso) {
  if (!iso) return '';
  // All-day events come through as YYYY-MM-DD without time
  if (/^\d{4}-\d{2}-\d{2}$/.test(iso)) return 'all day';
  var d = new Date(iso);
  if (isNaN(d.getTime())) return '';
  var s = d.toLocaleTimeString('en-US', {
    timeZone: 'America/Chicago',
    hour: 'numeric', minute: '2-digit', hour12: true,
  });
  // "9:30 AM" → "9:30am"
  return s.replace(' AM', 'am').replace(' PM', 'pm');
}

function fmtDueChip(dueDate) {
  if (!dueDate) return '';
  // dueDate is YYYY-MM-DD; show "Mon DD"
  var parts = dueDate.split('-');
  if (parts.length !== 3) return dueDate;
  var d = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
}

// ─── Today: Meetings ─────────────────────────────────────────────────────────

function loadMeetings() {
  var el = document.getElementById('today-meetings');
  apiFetch('/api/today/meetings').then(function(data) {
    var list = (data && data.meetings) || [];
    if (!list.length) {
      el.className = 'today-empty';
      el.textContent = 'No meetings today';
      return;
    }
    el.className = 'today-list';
    el.innerHTML = list.map(function(m) {
      var time = fmtTime(m.start);
      var titleHtml = m.hangoutLink
        ? '<a class="meeting-title" href="' + escapeHtml(m.hangoutLink) + '" target="_blank" rel="noopener">' + escapeHtml(m.title) + '</a>'
        : '<span class="meeting-title">' + escapeHtml(m.title) + '</span>';
      var clientHtml = m.client ? '<span class="meeting-client">' + escapeHtml(m.client) + '</span>' : '';
      return '<div class="meeting-row">' +
        '<span class="meeting-time">' + escapeHtml(time) + '</span>' +
        titleHtml +
        clientHtml +
      '</div>';
    }).join('');
  }).catch(function(e) {
    if (e.message === 'Unauthorized') return;
    el.className = 'today-error';
    el.textContent = e.message || 'Failed to load meetings';
  });
}

// ─── Today: Tasks ────────────────────────────────────────────────────────────

function rankTask(t) {
  // 0 = overdue (older first via dueDate asc), 1 = today, 2 = future (soonest first), 3 = no due
  if (t.isOverdue) return 0;
  if (t.isDueToday) return 1;
  if (t.dueDate) return 2;
  return 3;
}

function sortTasks(tasks) {
  return tasks.slice().sort(function(a, b) {
    var ra = rankTask(a), rb = rankTask(b);
    if (ra !== rb) return ra - rb;
    // Within bucket: by dueDate ascending if present
    if (a.dueDate && b.dueDate) return a.dueDate.localeCompare(b.dueDate);
    if (a.dueDate) return -1;
    if (b.dueDate) return 1;
    // No due dates → alphabetical fallback
    return (a.line || '').localeCompare(b.line || '');
  });
}

function loadTasks() {
  var el = document.getElementById('today-tasks');
  apiFetch('/api/today/tasks').then(function(data) {
    var tasks = sortTasks((data && data.tasks) || []);
    if (!tasks.length) {
      el.className = 'today-empty';
      el.textContent = 'No open tasks';
      return;
    }
    el.className = 'today-list';
    el.innerHTML = tasks.map(function(t) {
      var chip = '';
      if (t.dueDate) {
        var cls = t.isOverdue ? 'over' : (t.isDueToday ? 'today' : 'future');
        chip = '<span class="due-chip ' + cls + '">' + escapeHtml(fmtDueChip(t.dueDate)) + '</span>';
      }
      var urgent = t.urgent ? '<span class="task-urgent">!!</span>' : '';
      var clientHtml = t.client ? '<span class="task-client">' + escapeHtml(t.client) + '</span>' : '';
      return '<div class="task-row">' +
        '<span class="task-check">□</span>' +
        '<span class="task-text">' + urgent + escapeHtml(t.line) + '</span>' +
        clientHtml +
        chip +
      '</div>';
    }).join('');
  }).catch(function(e) {
    if (e.message === 'Unauthorized') return;
    el.className = 'today-error';
    el.textContent = e.message || 'Failed to load tasks';
  });
}

// ─── Sticker (yesterday CPP + 7-day avg) ─────────────────────────────────────

function loadSticker() {
  var grid = document.getElementById('sticker-cards');

  apiFetch('/api/cpp-daily').then(function(rows) {
    rows.sort(function(a, b) { return (a.name || a.id).localeCompare(b.name || b.id); });

    grid.innerHTML = rows.map(function(row) {
      if (row.error) {
        return '<div class="mini-card">' +
          '<div class="mini-name">' + shortName(row.name || row.id) + '</div>' +
          '<div class="mini-error">err</div>' +
        '</div>';
      }
      var cls = 'none';
      if (row.cpp != null && row.cppTarget) {
        cls = row.cpp <= row.cppTarget ? 'good' : 'over';
      }
      var valEl = row.cpp != null
        ? '<div class="mini-value ' + cls + '" id="sticker-cpp-' + row.id + '">' + fmt$(row.cpp) + '</div>'
        : '<div class="mini-value none">—</div>';

      return '<div class="mini-card ' + cls + '">' +
        '<div class="mini-name">' + shortName(row.name) + '</div>' +
        valEl +
        '<div class="mini-sub" id="sticker-7d-' + row.id + '">' +
          '<span class="mini-sub-loading">7d ···</span>' +
        '</div>' +
      '</div>';
    }).join('') || '<div class="empty-row">No sticker clients</div>';

    apiFetch('/api/cpp-7day').then(function(weekRows) {
      weekRows.forEach(function(w) {
        var el = document.getElementById('sticker-7d-' + w.id);
        if (!el) return;
        if (w.error || w.cpp == null) {
          el.textContent = '7d —';
        } else {
          el.textContent = '7d ' + fmt$(w.cpp);
        }
      });
    }).catch(function() {
      document.querySelectorAll('[id^="sticker-7d-"]').forEach(function(el) {
        el.textContent = '7d —';
      });
    });
  }).catch(function(e) {
    if (e.message !== 'Unauthorized') {
      grid.innerHTML = '<div class="empty-row">Failed to load: ' + e.message + '</div>';
    }
  });
}

// ─── Sheds (yesterday CPL via /api/sheds/cpl-yesterday proxy) ────────────────

function loadSheds() {
  var grid = document.getElementById('sheds-cards');

  apiFetch('/api/sheds/cpl-yesterday').then(function(rows) {
    if (!Array.isArray(rows) || rows.length === 0) {
      grid.innerHTML = '<div class="empty-row">No sheds clients</div>';
      return;
    }
    rows.sort(function(a, b) { return (a.name || '').localeCompare(b.name || ''); });

    grid.innerHTML = rows.map(function(row) {
      if (row.error) {
        return '<div class="mini-card">' +
          '<div class="mini-name">' + shortName(row.name || row.accountId) + '</div>' +
          '<div class="mini-error">err</div>' +
        '</div>';
      }
      var cpl = row.costPerResult;
      var valEl = cpl != null
        ? '<div class="mini-value">' + fmt$(cpl) + '</div>'
        : '<div class="mini-value none">—</div>';
      var sub = (row.results != null)
        ? row.results + (row.resultType ? ' ' + String(row.resultType).toLowerCase() : ' results')
        : '—';

      return '<div class="mini-card">' +
        '<div class="mini-name">' + shortName(row.name) + '</div>' +
        valEl +
        '<div class="mini-sub">' + sub + '</div>' +
      '</div>';
    }).join('');
  }).catch(function(e) {
    if (e.message !== 'Unauthorized') {
      grid.innerHTML = '<div class="empty-row">Sheds unavailable: ' + e.message + '</div>';
    }
  });
}

// ─── Boot ────────────────────────────────────────────────────────────────────

if (DASH_PASSWORD) {
  fetch('/api/auth/verify', { method: 'POST', headers: { 'x-dash-password': DASH_PASSWORD } })
    .then(function(r) {
      if (r.ok) showLaunchpad();
      else { sessionStorage.removeItem('dash_password'); showLogin(); }
    })
    .catch(function() { showLogin(); });
} else {
  fetch('/api/auth/verify', { method: 'POST' })
    .then(function(r) { if (r.ok) showLaunchpad(); else showLogin(); })
    .catch(function() { showLogin(); });
  document.getElementById('password').focus();
}
