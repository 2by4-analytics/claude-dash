<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2by4 — CPP Daily</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0a;
    --surface: #111111;
    --surface2: #161616;
    --border: #1e1e1e;
    --accent: #e8ff00;
    --text: #f0f0f0;
    --text-dim: #555;
    --text-mid: #888;
    --red: #ff4444;
    --yellow: #ffaa00;
    --green: #00ff88;
    --red-dim: rgba(255,68,68,0.08);
    --yellow-dim: rgba(255,170,0,0.08);
    --green-dim: rgba(0,255,136,0.08);
    --mono: 'Space Mono', monospace;
    --sans: 'DM Sans', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: var(--sans); min-height: 100vh; }

  /* ── Nav ── */
  nav {
    display: flex;
    align-items: center;
    gap: 20px;
    padding: 0 32px;
    height: 48px;
    border-bottom: 1px solid var(--border);
  }

  .nav-logo {
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 700;
    color: var(--accent);
    text-decoration: none;
    letter-spacing: 0.05em;
  }

  .nav-sep { color: var(--text-dim); font-size: 12px; }
  .nav-page { font-family: var(--mono); font-size: 11px; color: var(--text-mid); letter-spacing: 0.05em; }

  .nav-right {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .nav-link {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dim);
    text-decoration: none;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    transition: color 0.15s;
  }

  .nav-link:hover { color: var(--text); }

  .refresh-btn {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 10px;
    padding: 5px 12px;
    cursor: pointer;
    letter-spacing: 0.05em;
    transition: all 0.15s;
  }

  .refresh-btn:hover { border-color: var(--text-dim); color: var(--text); }
  .refresh-btn:disabled { opacity: 0.3; cursor: not-allowed; }

  /* ── Page ── */
  .page {
    max-width: 1280px;
    margin: 0 auto;
    padding: 48px 32px 80px;
  }

  .heading {
    margin-bottom: 28px;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    gap: 24px;
    flex-wrap: wrap;
  }

  .heading-label {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.15em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .heading-date {
    font-size: 26px;
    font-weight: 300;
    color: var(--text);
    letter-spacing: -0.01em;
  }

  .heading-meta {
    margin-top: 6px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
  }

  /* ── Three-column grid ── */
  .client-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }

  /* ── Date filter ── */
  .filter-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .filter-pill {
    background: none;
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-family: var(--mono);
    font-size: 10px;
    padding: 6px 12px;
    cursor: pointer;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    transition: all 0.15s;
  }

  .filter-pill:hover { border-color: var(--text-dim); color: var(--text); }
  .filter-pill.active {
    background: var(--accent);
    border-color: var(--accent);
    color: #000;
  }

  .custom-range {
    display: none;
    align-items: center;
    gap: 6px;
    margin-left: 4px;
  }

  .custom-range.open { display: flex; }

  .custom-range input[type="date"] {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: var(--mono);
    font-size: 10px;
    padding: 5px 8px;
    color-scheme: dark;
  }

  .custom-range button {
    background: var(--accent);
    border: 1px solid var(--accent);
    color: #000;
    font-family: var(--mono);
    font-size: 10px;
    padding: 5px 10px;
    cursor: pointer;
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }

  .custom-range button:disabled { opacity: 0.3; cursor: not-allowed; }

  .client-card {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 20px 22px;
    display: flex;
    flex-direction: column;
  }

  .client-card.good { border-color: rgba(0,255,136,0.15); }
  .client-card.warn { border-color: rgba(255,170,0,0.15); }
  .client-card.over { border-color: rgba(255,68,68,0.15); }

  .card-name {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-mid);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 14px;
  }

  .card-cpp {
    font-family: var(--mono);
    font-size: 38px;
    font-weight: 700;
    line-height: 1;
    margin-bottom: 6px;
  }

  .card-cpp.good { color: var(--green); }
  .card-cpp.warn { color: var(--yellow); }
  .card-cpp.over { color: var(--red); }
  .card-cpp.none { color: var(--text-dim); font-size: 26px; font-weight: 400; }

  .card-vs-target {
    font-family: var(--mono);
    font-size: 11px;
    margin-bottom: 18px;
  }

  .card-vs-target.good { color: var(--green); }
  .card-vs-target.warn { color: var(--yellow); }
  .card-vs-target.over { color: var(--red); }
  .card-vs-target.none { color: var(--text-dim); }

  .card-divider {
    height: 1px;
    background: var(--border);
    margin-bottom: 14px;
  }

  .card-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
  }

  .card-row:last-child { margin-bottom: 0; }

  .card-row-label {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--text-dim);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .card-row-value {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text-mid);
  }

  .card-7d {
    font-family: var(--mono);
    font-size: 13px;
    color: var(--text-mid);
  }

  .card-7d-vs {
    font-size: 10px;
    margin-left: 6px;
  }

  .card-7d-vs.better { color: var(--green); }
  .card-7d-vs.worse  { color: var(--red); }

  .card-7d-loading {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    animation: fade 1.2s ease-in-out infinite;
  }

  .card-error {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 20px 22px;
  }

  .card-error-name {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.06em;
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .card-error-msg {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--red);
  }

  /* ── Footer summary ── */
  .footer-summary {
    display: flex;
    gap: 40px;
    margin-top: 32px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
  }

  .footer-stat-label {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--text-dim);
    letter-spacing: 0.12em;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .footer-stat-value {
    font-family: var(--mono);
    font-size: 16px;
    color: var(--text-mid);
  }

  .skeleton {
    background: var(--surface);
    border: 1px solid var(--border);
    height: 180px;
    animation: fade 1.2s ease-in-out infinite;
  }

  @keyframes fade {
    0%, 100% { opacity: 0.3; }
    50%       { opacity: 0.7; }
  }

  @media (max-width: 900px) {
    .client-grid { grid-template-columns: 1fr 1fr; }
  }

  @media (max-width: 600px) {
    .client-grid { grid-template-columns: 1fr; }
    .heading { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>

<nav>
  <a href="/" class="nav-logo">2×4</a>
  <span class="nav-sep">/</span>
  <span class="nav-page">CPP Daily</span>
  <div class="nav-right">
    <a href="/" class="nav-link">← Dashboard</a>
    <button class="refresh-btn" id="refresh-btn" onclick="load()">Refresh</button>
  </div>
</nav>

<div class="page">
  <div class="heading">
    <div>
      <div class="heading-label">Sticker Funnel · Account CPP</div>
      <div class="heading-date" id="heading-date">Yesterday</div>
      <div class="heading-meta" id="heading-meta">Loading...</div>
    </div>
    <div class="filter-bar">
      <button class="filter-pill" data-range="today">Today</button>
      <button class="filter-pill active" data-range="yesterday">Yesterday</button>
      <button class="filter-pill" data-range="7d">Last 7</button>
      <button class="filter-pill" data-range="custom">Custom</button>
      <div class="custom-range" id="custom-range">
        <input type="date" id="custom-start">
        <span style="color:var(--text-dim);font-family:var(--mono);font-size:10px;">→</span>
        <input type="date" id="custom-end">
        <button id="custom-apply">Apply</button>
      </div>
    </div>
  </div>

  <div class="client-grid" id="client-grid">
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
    <div class="skeleton"></div>
  </div>

  <div class="footer-summary" id="footer-summary" style="display:none;">
    <div>
      <div class="footer-stat-label">Total Spend</div>
      <div class="footer-stat-value" id="stat-spend">—</div>
    </div>
    <div>
      <div class="footer-stat-label">Total Purchases</div>
      <div class="footer-stat-value" id="stat-purchases">—</div>
    </div>
    <div>
      <div class="footer-stat-label">Blended CPP</div>
      <div class="footer-stat-value" id="stat-cpp">—</div>
    </div>
  </div>
</div>

<script>
var DASH_PASSWORD = localStorage.getItem('dash_password') || '';

function apiFetch(path) {
  return fetch(path, { headers: { 'x-dash-password': DASH_PASSWORD } }).then(r => {
    if (r.status === 401) {
      localStorage.removeItem('dash_password');
      window.location.href = '/';
      throw new Error('Unauthorized');
    }
    return r.json();
  });
}

// ── Helpers ──────────────────────────────────────────────────────────────────

function fmt$(n) {
  if (n == null || isNaN(n)) return '—';
  return '$' + Number(n).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}

function fmtInt(n) {
  if (n == null || isNaN(n)) return '—';
  return Math.round(n).toLocaleString();
}

function cppClass(cpp, target) {
  if (cpp == null) return 'none';
  const r = cpp / target;
  if (r <= 1.0)  return 'good';
  if (r <= 1.15) return 'warn';
  return 'over';
}

function vsTargetLabel(cpp, target) {
  if (cpp == null) return { text: 'No data', cls: 'none' };
  const diff = cpp - target;
  const pct = Math.abs(diff / target * 100).toFixed(0);
  if (diff <= 0) return { text: `${pct}% under target`, cls: 'good' };
  return { text: `${pct}% over $${target} target`, cls: diff / target <= 0.15 ? 'warn' : 'over' };
}

// ── Date range state ─────────────────────────────────────────────────────────

var currentRange = { kind: 'yesterday', startDate: null, endDate: null };

function todayCT() {
  // Approximation: assume the browser is in or near CT. The server resolves
  // the actual "today" for cache purposes; this is just for default Custom inputs.
  return new Date().toISOString().split('T')[0];
}

function shiftDate(yyyymmdd, deltaDays) {
  const d = new Date(yyyymmdd + 'T12:00:00Z');
  d.setUTCDate(d.getUTCDate() + deltaDays);
  return d.toISOString().split('T')[0];
}

function resolveRange(kind, customStart, customEnd) {
  const today = todayCT();
  if (kind === 'today')     return { startDate: today, endDate: today };
  if (kind === 'yesterday') return { startDate: shiftDate(today, -1), endDate: shiftDate(today, -1) };
  if (kind === '7d')        return { startDate: shiftDate(today, -7), endDate: shiftDate(today, -1) };
  if (kind === 'custom')    return { startDate: customStart, endDate: customEnd };
  return { startDate: null, endDate: null };
}

function rangeLabel(kind, startDate, endDate) {
  function fmt(d) {
    const dt = new Date(d + 'T12:00:00');
    return dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }
  if (kind === 'today')     return 'Today · ' + fmt(startDate);
  if (kind === 'yesterday') {
    const dt = new Date(startDate + 'T12:00:00');
    return dt.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' });
  }
  if (kind === '7d')        return 'Last 7 days · ' + fmt(startDate) + ' – ' + fmt(endDate);
  if (kind === 'custom')    return fmt(startDate) + ' – ' + fmt(endDate);
  return '';
}

// ── Load ─────────────────────────────────────────────────────────────────────

async function load() {
  const btn = document.getElementById('refresh-btn');
  btn.disabled = true;
  btn.textContent = 'Loading...';

  const showSkeleton = currentRange.kind !== 'yesterday';
  if (showSkeleton) {
    const cells = Array.from({length:6}).map(() => '<div class="skeleton"></div>').join('');
    document.getElementById('client-grid').innerHTML = cells;
  }

  // Build URL. Default (yesterday) uses cached endpoint with no params.
  const isDefault = currentRange.kind === 'yesterday';
  let url = '/api/cpp-daily';
  if (!isDefault) {
    const { startDate, endDate } = resolveRange(currentRange.kind, currentRange.startDate, currentRange.endDate);
    url += '?startDate=' + startDate + '&endDate=' + endDate;
  }

  const dailyPromise = apiFetch(url);
  const weekPromise  = isDefault ? apiFetch('/api/cpp-7day') : null;

  try {
    const rows = await dailyPromise;
    render(rows);
    btn.disabled = false;
    btn.textContent = 'Refresh';

    if (!weekPromise) return;

    weekPromise.then(weekRows => {
      const byId = {};
      for (const r of weekRows) byId[r.id] = r;
      for (const [id, w] of Object.entries(byId)) {
        const el = document.getElementById('7d-' + id);
        if (!el) continue;
        if (w.error) {
          el.innerHTML = '<span class="card-7d" style="color:var(--text-dim);">—</span>';
        } else {
          const dayCppStr = document.getElementById('cpp-' + id)?.dataset.cpp;
          const dayCpp = dayCppStr ? parseFloat(dayCppStr) : null;
          var vsHtml = '';
          if (dayCpp && w.cpp) {
            const diff = dayCpp - w.cpp;
            const pct = Math.abs(diff / w.cpp * 100).toFixed(0);
            const cls = diff <= 0 ? 'better' : 'worse';
            const arrow = diff <= 0 ? '↓' : '↑';
            vsHtml = '<span class="card-7d-vs ' + cls + '">' + arrow + pct + '%</span>';
          }
          el.innerHTML = '<span class="card-7d">' + fmt$(w.cpp) + vsHtml + '</span>';
        }
      }
    }).catch(() => {
      document.querySelectorAll('[id^="7d-"]').forEach(el => {
        el.innerHTML = '<span class="card-7d" style="color:var(--text-dim);">—</span>';
      });
    });

  } catch (e) {
    if (e.message !== 'Unauthorized') {
      document.getElementById('client-grid').innerHTML =
        '<div class="card-error" style="grid-column:1/-1"><div class="card-error-msg">Error: ' + e.message + '</div></div>';
      document.getElementById('heading-meta').textContent = 'Failed to load';
    }
    btn.disabled = false;
    btn.textContent = 'Refresh';
  }
}

function render(rows) {
  const firstValid = rows.find(r => r.date);
  if (firstValid) {
    const start = firstValid.date;
    const end = firstValid.endDate || firstValid.date;
    document.getElementById('heading-date').textContent = rangeLabel(currentRange.kind, start, end);
  }
  document.getElementById('heading-meta').textContent =
    'Updated ' + new Date().toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });

  const showWeekRow = currentRange.kind === 'yesterday';

  const valid = rows.filter(r => !r.error);
  const totalSpend = valid.reduce((s, r) => s + (r.spend || 0), 0);
  const totalPurchases = valid.reduce((s, r) => s + (r.purchases || 0), 0);
  const blended = totalPurchases > 0 ? totalSpend / totalPurchases : null;

  document.getElementById('stat-spend').textContent = fmt$(totalSpend);
  document.getElementById('stat-purchases').textContent = fmtInt(totalPurchases);
  document.getElementById('stat-cpp').textContent = fmt$(blended);
  document.getElementById('footer-summary').style.display = 'flex';

  rows.sort((a, b) => (a.name || a.id).localeCompare(b.name || b.id));

  document.getElementById('client-grid').innerHTML = rows.map(row => {
    if (row.error) {
      return '<div class="card-error"><div class="card-error-name">' + (row.name || row.id) + '</div>' +
        '<div class="card-error-msg">' + row.error + '</div></div>';
    }

    const cls = cppClass(row.cpp, row.cppTarget);
    const vt = vsTargetLabel(row.cpp, row.cppTarget);

    const weekRowHtml = showWeekRow
      ? '<div class="card-row"><span class="card-row-label">7D Avg</span>' +
          '<span id="7d-' + row.id + '"><span class="card-7d-loading">loading...</span></span>' +
        '</div>'
      : '';

    return '<div class="client-card ' + cls + '">' +
      '<div class="card-name">' + row.name + '</div>' +
      '<div class="card-cpp ' + cls + '" id="cpp-' + row.id + '" data-cpp="' + (row.cpp ?? '') + '">' + (row.cpp != null ? fmt$(row.cpp) : '—') + '</div>' +
      '<div class="card-vs-target ' + vt.cls + '">' + vt.text + '</div>' +
      '<div class="card-divider"></div>' +
      '<div class="card-row"><span class="card-row-label">Spend</span><span class="card-row-value">' + fmt$(row.spend) + '</span></div>' +
      '<div class="card-row"><span class="card-row-label">Purchases</span><span class="card-row-value">' + fmtInt(row.purchases) + '</span></div>' +
      weekRowHtml +
    '</div>';
  }).join('');
}

// ── Filter wiring ────────────────────────────────────────────────────────────

function setActivePill(kind) {
  document.querySelectorAll('.filter-pill').forEach(b => {
    b.classList.toggle('active', b.dataset.range === kind);
  });
}

document.querySelectorAll('.filter-pill').forEach(btn => {
  btn.addEventListener('click', () => {
    const kind = btn.dataset.range;
    if (kind === 'custom') {
      const today = todayCT();
      const startInput = document.getElementById('custom-start');
      const endInput = document.getElementById('custom-end');
      if (!startInput.value) startInput.value = shiftDate(today, -7);
      if (!endInput.value) endInput.value = shiftDate(today, -1);
      document.getElementById('custom-range').classList.add('open');
      setActivePill('custom');
      return;
    }
    document.getElementById('custom-range').classList.remove('open');
    currentRange = { kind, startDate: null, endDate: null };
    setActivePill(kind);
    load();
  });
});

document.getElementById('custom-apply').addEventListener('click', () => {
  const s = document.getElementById('custom-start').value;
  const e = document.getElementById('custom-end').value;
  if (!s || !e) return;
  if (s > e) { alert('Start date must be on or before end date.'); return; }
  currentRange = { kind: 'custom', startDate: s, endDate: e };
  setActivePill('custom');
  load();
});

if (DASH_PASSWORD) {
  load();
} else {
  window.location.href = '/';
}
</script>
</body>
</html>
